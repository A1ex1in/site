<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Вход</title>
    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>
    <h1>Вход в систему</h1>
    <form id="loginForm">
        <div>
            <label for="email">
                Email
            </label>
            <input
                id="email"
                type="email"
                autocomplete="email"
                required
            >
        </div>
        <div>
            <label for="password">
                Пароль
            </label>
            <input
                id="password"
                type="password"
                autocomplete="current-password"
                required
            >
        </div>
        <button type="submit">
            Войти
        </button>
    </form>
    <p id="message"></p>
    <p>
        Нет учётной записи?
        <a href="register.html">
            Зарегистрироваться
        </a>
    </p>
    <script src="login.js"></script>
</body>
</html>

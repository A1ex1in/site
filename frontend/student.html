<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моё обучение — EduPlatform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="student-learning">
    <header class="learning-topbar">
        <a class="learning-brand" href="#" id="homeLink" aria-label="EduPlatform — на главную">
            <span class="learning-brand-mark">E</span>
            <span>EduPlatform</span>
        </a>
        <nav class="learning-nav" aria-label="Навигация студента">
            <button type="button" id="coursesNavButton">Моё обучение</button>
            <button type="button" id="profileNavButton">Профиль</button>
            <button class="learning-avatar" type="button" id="avatarButton" aria-label="Открыть профиль">С</button>
            <button class="learning-logout" type="button" id="logoutButton">Выйти</button>
        </nav>
    </header>
    <div class="learning-progress" id="learningProgress" hidden><span></span></div>
    <p class="learning-notice" id="message" aria-live="polite"></p>
    <main id="studentApp" class="learning-app" aria-live="polite">
        <div class="learning-loader">Загружаем учебный кабинет…</div>
    </main>
    <script src="student-learning.js"></script>
</body>
</html>

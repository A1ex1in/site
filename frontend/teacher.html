<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кабинет преподавателя</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Кабинет преподавателя</h1>
    <button id="logoutButton">Выйти</button>
    <h2>Заявки на регистрацию</h2>
    <div id="studentsList">Загрузка...</div>
    <p id="message"></p>

    <hr>
        <h2>Учебные группы</h2>
        <form id="groupForm">
            <div>
                <label for="groupName">Название группы</label>
                <input id="groupName" type="text" placeholder="Например, АТ-232" required>
            </div>
            <div>
                <label for="groupDescription">Описание</label>
                <input id="groupDescription" type="text" placeholder="Учебная группа АТ-232">
            </div>
            <button type="submit">Добавить группу</button>
        </form>
        <div id="groupsList">Загрузка групп...</div>
        <section id="groupStudentsSection" hidden>
            <h3 id="selectedGroupName">Студенты группы</h3>
            <div id="groupStudentsList"></div>
        </section>
        <section id="studentDetailsSection" hidden>
            <hr>
                <h3>Карточка студента</h3>
                <div id="studentDetails"></div>
                <h4>Изменить группу</h4>
                <form id="changeGroupForm">
                    <select id="studentGroupSelect" required></select>
                    <button type="submit">Сохранить группу</button>
                </form>
                <button id="studentStatusButton" type="button"></button>
        </section>

    <hr>
        <h2>Дисциплины</h2>
        <form id="disciplineForm">
            <div>
                <label for="disciplineName">Название дисциплины</label>
                <input id="disciplineName" type="text" placeholder="Микропроцессорные системы" required>
            </div>
            <div>
                <label for="disciplineCode">Код</label>
                <input id="disciplineCode" type="text" placeholder="МПС" required>
            </div>
            <div>
                <label for="disciplineDescription">Описание</label>
                <input id="disciplineDescription" type="text" placeholder="Описание дисциплины">
            </div>
            <button type="submit">Добавить дисциплину</button>
        </form>
        <div id="disciplinesList">
            Загрузка дисциплин...
        </div>

    <hr>
        <h2>Учебные курсы</h2>
        <form id="courseForm">
            <div>
                <label for="courseDiscipline">Дисциплина</label>
                <select id="courseDiscipline" required></select>
            </div>
            <div>
                <label for="courseGroup">Группа</label>
                <select id="courseGroup" required></select>
            </div>
            <div>
                <label for="courseAcademicYear">Учебный год</label>
                <input id="courseAcademicYear" type="text" placeholder="2026/2027" required>
            </div>
            <div>
                <label for="courseSemester">Семестр</label>
                <select id="courseSemester" required>
                    <option value="1">1</option>
                    <option value="2">2</option>
                </select>
            </div>
            <button type="submit">Создать курс</button>
        </form>
        <div id="coursesList">Загрузка учебных курсов...</div>

    <hr>
        <section id="courseMaterialsSection" hidden>
            <h2 id="courseMaterialsTitle">Материалы курса</h2>
            <form id="materialForm">
                <div>
                    <label for="materialTitle">Название</label>
                    <input id="materialTitle" type="text" required>
                </div>
                <div>
                    <label for="materialType">Тип материала</label>
                    <select id="materialType">
                        <option value="lecture">Лекция</option>
                        <option value="presentation">Презентация</option>
                        <option value="methodical">Методический материал</option>
                        <option value="other">Прочее</option>
                    </select>
                </div>
                <div>
                    <label for="materialDescription">Описание</label>
                    <input id="materialDescription" type="text">
                </div>
                <button type="submit">Создать материал</button>
            </form>
            <div id="materialsList"></div>
        </section>

    <hr>
        <section id="materialFilesSection" hidden>
            <h3 id="materialFilesTitle">Файлы материала</h3>
            <form id="materialFileForm">
                <input id="materialFileInput" type="file" required>
                <button type="submit">Загрузить файл</button>
            </form>
            <div id="materialFilesList"></div>
        </section>

    <script src="teacher.js"></script>
</body>
</html>
